# See https://wiki.hyprland.org/Configuring/Monitors/
monitor= ,preferred,auto,1
monitor=eDP-1,preferred,0x0,1
monitor= ,preferred,auto-center-up,1, #mirror, eDP-1


# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Set programs that you use
$terminal = kitty
$fileManager = nemo
$menu = rofi -show drun
#$browser = brave --disable-features=WaylandWpColorManagerV1
$browser = firefox
$editor = code
$wallpaper-setter = waypaper --restore

# Execute your favorite apps at launch
# exec-once = blueman-applet
exec-once = swaync
exec-once = $wallpaper-setter
#exec-once = hypridle
# exec-once = kdeconnectd
# exec-once = waybar
exec-once = qs -c noctalia-shell --no-duplicate
# exec-once = hyprpanel
exec-once = nm-applet
exec-once = systemctl --user start hyprpolkitagent

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

#exec-once = ~/.config/hypr/monitor.sh

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Some default env vars.
env = XCURSOR_SIZE, 30
env = XCURSOR_THEME, rose-pine-cursor
env = QT_QPA_PLATFORMTHEME, qt5ct # change to qt6ct if you have that
env = WLR_NO_HARDWARE_CURSORS,1
env = GOPATH, /home/tom/.local/go/

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = de
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    accel_profile = flat
    sensitivity = 1 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
        disable_while_typing = false
        middle_button_emulation = true
        gesture = 3, horizontal, workspace
    }

}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 5
    gaps_out = 10
    border_size = 1
    #col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.active_border = rgba(DBBC7Fff)
    col.inactive_border = rgba(595959aa)

    layout = master

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 10
    
    blur {
        enabled = true
        size = 4
        passes = 2
    }
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0, 1.0

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    new_status = master
    new_on_top = true
    mfact = 0.5
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    workspace_swipe_forever = true
    
}

misc {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
}

device {
    name = elan-touchpad
    sensitivity = 0.85
    accel_profile = flat
}

device {
    name = logitech-usb-receiver
    sensitivity = 0.3
}

workspace = 1, monitor:eDP-1
workspace = 2, monitor:eDP-1
workspace = 3, monitor:eDP-1
workspace = 4, monitor:eDP-1
workspace = 5, monitor:eDP-1
workspace = 6, monitor:HDMI-A-2
workspace = 7, monitor:HDMI-A-2
workspace = 8, monitor:HDMI-A-2
workspace = 9, monitor:HDMI-A-2
workspace = 0, monitor:HDMI-A-2


# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod SHIFT, Return, exec, $terminal
bind = $mainMod SHIFT, C, killactive, 
bind = $mainMod SHIFT, Q, exit, 
bind = $mainMod, E, exec, $fileManager
bind = $mainMod CTRL, space, togglefloating, 
bind = $mainMod, P, exec, $menu
bind = $mainMod, F, exec, $browser
bind = $mainMod, D, exec, discord
bind = $mainMod, S, exec, spotify-launcher
bind = $mainMod, C, exec, $editor
bind = $mainMod CTRL, S, exec, systemctl suspend
bind = $mainMod, M, fullscreen, 0
bind = $mainMod CTRL, M, fullscreen, 1
bind = $mainMod CTRL, W, exec, $wallpaper-setter
bind = , Print, exec, grim -g "$(slurp)" - | swappy -f - # grim -g "$(slurp -d)" - | wl-copy -t image/png
#bind = , Print, exec, HYPRSHOT_EDITOR=1 quickshell -c HyprQuickFrame -n | wl-copy -t image/png
# Shader
#bind = $mainMod SHIFT, I, exec, hyprshade toggle invert-colors
bind = $mainMod Shift, B, exec, hyprshade toggle blue-light-filter
bind = $mainMod Shift, I, exec, /home/tom/.config/hypr/reading_mode.sh

bind = $mainMod CTRL, M, exec, /home/tom/.config/hypr/mirror-screen.sh

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, J, layoutmsg, cycleprev
bind = $mainMod, K, layoutmsg, cyclenext
bind = $mainMod, Return, layoutmsg, swapwithmaster master

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Resize windows in master layout
binde=$mainMod,L,resizeactive,20 0
binde=$mainMod,H,resizeactive,-20 0

# fn buttons
binde=,XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binde=,XF86AudioRaiseVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind =,XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind =,XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
binde=,XF86MonBrightnessUp,   exec, blight set +10%
binde=,XF86MonBrightnessDown, exec, blight set -10%

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Screen Sharing stuff
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

windowrule {
    name = xwayland-video-bridge-fixes
    match:class = xwaylandvideobridge

    no_initial_focus = true
    no_focus = true
    no_anim = true
    no_blur = true
    max_size = 1 1
    opacity = 0.0
}

windowrule {
    name = intelij-tabs
    match:class = ^(jetbrains-.*)
    match:title = ^(win.*)
    float = on
}

windowrule {
    name = intelij-tabss
    match:class = ^(jetbrains-.*)
    no_initial_focus = on
}